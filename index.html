<script>
// Client router for GitHub Pages sub-routes
document.addEventListener('click', function(e) {
  var a = e.target.closest('a');
  if (!a) return;
  var href = a.getAttribute('href');
  if (!href) return;

  // Brochure click
  var txt = (a.textContent || a.innerText || '').toLowerCase();
  if (txt.includes('brochure') || txt.includes('brocher') || a.classList.contains('brochure') || href.includes('brochure')) {
    e.preventDefault();
    e.stopPropagation();
    window.open('./brochure/JTMS-Brochure.pdf', '_blank');
    return false;
  }

  // Anchor smooth scroll
  if (href.startsWith('#')) {
    var el = document.querySelector(href);
    if (el) {
      e.preventDefault();
      el.scrollIntoView({ behavior: 'smooth' });
      return;
    }
  }

  // Check if link is an internal page
  var clean = href.replace(/^\.\//, '').replace(/^\//, '').replace(/^game\//, '').replace(/\/$/, '').replace(/\.html$/, '');
  var internalPages = ['about', 'premium-services', 'media', 'clients', 'gallery', 'contact', 'home'];
  if (internalPages.includes(clean)) {
    e.preventDefault();
    var basePath = window.location.pathname.startsWith('/game') ? '/game/' : './';
    var target = clean === 'home' ? basePath : basePath + clean;
    window.location.href = target;
  }
}, true);


if (window.location.pathname.endsWith('/admin') || window.location.pathname.endsWith('/admin/')) {
  window.location.replace('./admin.html');
}

// Brochure global click interceptor
document.addEventListener('click', function(e) {
  var btn = e.target && e.target.closest && e.target.closest('a, button, .brochure, [class*="brochure"]');
  if (btn) {
    var txt = (btn.textContent || btn.innerText || '').toLowerCase();
    var href = btn.getAttribute('href') || '';
    if (txt.includes('brochure') || txt.includes('brocher') || btn.classList.contains('brochure') || href.includes('brochure')) {
      e.preventDefault();
      e.stopPropagation();
      window.open('./brochure/JTMS-Brochure.pdf', '_blank');
      return false;
    }
  }
}, true);

window.addEventListener('submit', function(e) {
  try {
    var form = e.target;
    var fd = new FormData(form);
    var obj = {};
    fd.forEach(function(v, k) { obj[k] = v; });
    var list = JSON.parse(localStorage.getItem('jtms_inquiries') || '[]');
    var item = {
      id: Date.now(),
      form: form.getAttribute('data-form-key') || form.id || 'Website Inquiry',
      fields: obj,
      name: obj.name || obj.fullName || obj.customer_name || 'Customer',
      phone: obj.phone || obj.mobile || obj.number || '',
      email: obj.email || '',
      service: obj.service || obj.serviceType || 'Security & Manpower Services',
      area: obj.area || obj.location || obj.message || 'Bangalore',
      date: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
      status: 'New'
    };
    if (item.name || item.phone) {
      list.unshift(item);
      localStorage.setItem('jtms_inquiries', JSON.stringify(list));
      window.dispatchEvent(new CustomEvent('jtms:new_inquiry', { detail: item }));
    }
  } catch(err) {
    console.error(err);
  }
}, true);
</script>
