<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JTMS Redirecting...</title>
  <script>
    var path = window.location.pathname;
    if (path.indexOf('/admin') !== -1) {
      window.location.replace(path.replace(/\/admin\/?.*$/, '/admin.html'));
    } else {
      window.location.replace('/game/');
    }
  </script>
</head>

</html>
