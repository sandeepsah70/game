<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JTMS Manpower & Security Services</title>
  <script>
    // GitHub Pages SPA Redirect to preserve sub-routes
    var path = window.location.pathname;
    // If not starting with /game, redirect into /game/
    if (!path.startsWith('/game')) {
      path = '/game' + path;
    }
    // Clean trailing slashes or redirect
    window.location.replace(path + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>Loading JTMS Security Services...</p>
</body>
</html>
